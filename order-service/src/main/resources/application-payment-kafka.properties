# Activar junto con local en el laboratorio: SPRING_PROFILES_ACTIVE=local,payment-kafka
payment.integration.enabled=true
payment.recovery.enabled=true
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
payment.service.metodo=${PAYMENT_METHOD:TARJETA}
payment.service.connect-timeout-ms=${PAYMENT_CONNECT_TIMEOUT_MS:2000}
payment.service.read-timeout-ms=${PAYMENT_READ_TIMEOUT_MS:3000}
payment.kafka.group-id=${ORDER_KAFKA_GROUP:order-service-group}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
