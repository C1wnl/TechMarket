spring.application.name=order-service
server.port=8084
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/order-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:techmarket_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
product.service.connect-timeout-ms=${PRODUCT_CONNECT_TIMEOUT_MS:2000}
product.service.read-timeout-ms=${PRODUCT_READ_TIMEOUT_MS:3000}

spring.profiles.default=local
