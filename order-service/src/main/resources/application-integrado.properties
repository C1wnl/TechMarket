# JWT
jwt.secret=${JWT_SECRET}

# Eureka
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${EUREKA_INSTANCE_HOST:127.0.0.1}

# Comunicación interna con Product
stock.internal.key=${STOCK_INTERNAL_KEY}

# Integración con Payment
payment.integration.enabled=true
payment.internal.key=${PAYMENT_INTERNAL_KEY}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
payment.service.connect-timeout-ms=${PAYMENT_CONNECT_TIMEOUT_MS:2000}
payment.service.read-timeout-ms=${PAYMENT_READ_TIMEOUT_MS:3000}
payment.service.metodo=${PAYMENT_METHOD:TARJETA}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${PAYMENT_KAFKA_GROUP_ID:order-service-group}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

# Recuperación de Saga e Inbox
payment.recovery.enabled=true
payment.recovery.delay-ms=2000
payment.kafka.group-id=${PAYMENT_KAFKA_GROUP_ID:order-service-group}
payment.kafka.auto-startup=true
