name: techmarket

services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  product-db:
    image: postgres:16
    environment:
      POSTGRES_DB: product-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product-db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order-db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment-db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  notification-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notification-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification-db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-events-dlt --partitions 1 --replication-factor 1
    restart: "no"

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      SERVER_ADDRESS: 0.0.0.0
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      user-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      USER_SERVICE_URL: http://user-service:8082
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      USER_INTERNAL_KEY: ${USER_INTERNAL_KEY:?Configura USER_INTERNAL_KEY en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    restart: unless-stopped

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    depends_on:
      product-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://product-db:5432/product-db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      STOCK_INTERNAL_KEY: ${STOCK_INTERNAL_KEY:?Configura STOCK_INTERNAL_KEY en .env}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    depends_on:
      order-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      product-service:
        condition: service_started
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: integrado
      DB_URL: jdbc:postgresql://order-db:5432/order-db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      PRODUCT_SERVICE_URL: http://product-service:8083
      USER_SERVICE_URL: http://user-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8085
      STOCK_INTERNAL_KEY: ${STOCK_INTERNAL_KEY:?Configura STOCK_INTERNAL_KEY en .env}
      USER_INTERNAL_KEY: ${USER_INTERNAL_KEY:?Configura USER_INTERNAL_KEY en .env}
      PAYMENT_INTERNAL_KEY: ${PAYMENT_INTERNAL_KEY:?Configura PAYMENT_INTERNAL_KEY en .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_KAFKA_GROUP_ID: order-service-group
    restart: unless-stopped

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    depends_on:
      payment-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8085:8085"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://payment-db:5432/payment-db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      PAYMENT_INTERNAL_KEY: ${PAYMENT_INTERNAL_KEY:?Configura PAYMENT_INTERNAL_KEY en .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    depends_on:
      notification-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8086:8086"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://notification-db:5432/notification-db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    ports:
      - "8088:80"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    depends_on:
      - eureka-server
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    restart: unless-stopped

volumes:
  auth_data:
    name: techmarket-databases_auth_data
  user_data:
    name: techmarket-databases_user_data
  product_data:
    name: techmarket-databases_product_data
  order_data:
    name: techmarket-databases_order_data
  payment_data:
    name: techmarket-databases_payment_data
  notification_data:
    name: techmarket-databases_notification_data
  kafka_data:
    name: kafka_kafka_data