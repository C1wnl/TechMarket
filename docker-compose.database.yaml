name: techmarket-databases

services:
  auth-db:
    image: postgres:16
    container_name: techmarket-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-techmarket_local}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-db:
    image: postgres:16
    container_name: techmarket-user-db
